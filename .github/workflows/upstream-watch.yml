# 监听 Gitee 真上游（FancyCabbage/skyland-auto-sign），有更新时通过 Server酱提醒。
# 本仓库已脱离 fork（独立仓库），不存在 GitHub 的「Sync fork」入口；
# 上游对比一律以 Gitee 为准，YueHen14 镜像只作为 git remote（upstream）存在。
name: Upstream Watch

on:
  schedule:
    - cron: '37 0 * * 1' # UTC 0:37 = 北京时间每周一 8:37（错开整点高峰）
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compare with Gitee upstream
        env:
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
        run: |
          set -e
          git fetch https://gitee.com/FancyCabbage/skyland-auto-sign.git master
          UPSTREAM=$(git rev-parse FETCH_HEAD)
          echo "upstream HEAD: $UPSTREAM"

          # 只比较上游真正维护的代码路径，忽略本仓库新增的 workflow/README 定制。
          # 判据是「内容树是否一致」，前提是本仓不改 src；一旦有意分叉改 src，
          # 这里会永久周报，需换成记录已对齐上游 SHA 的方式。
          # 排除 __pycache__：编译缓存不是上游代码，误提交时会把这把尺永久污染。
          WATCH_PATHS=(src requirements.txt ':(exclude,glob)**/__pycache__/**')
          if git diff --quiet HEAD FETCH_HEAD -- "${WATCH_PATHS[@]}"; then
            echo "No upstream changes affecting src/ or requirements.txt"
            exit 0
          fi

          echo "Upstream has new changes, sending ServerChan notification."

          {
            echo "Gitee 上游 [skyland-auto-sign](https://gitee.com/FancyCabbage/skyland-auto-sign) 有新的更新，代码与本仓库存在差异。"
            echo ""
            echo "**本仓与上游的差异：**"
            echo '```'
            git diff --stat HEAD FETCH_HEAD -- "${WATCH_PATHS[@]}"
            echo '```'
            echo ""
            echo "**上游最近提交（仅触及监听路径）：**"
            echo '```'
            git log --oneline -10 FETCH_HEAD -- src requirements.txt
            echo '```'
            echo ""
            echo "**处理方式：**"
            echo "1. 本地：git fetch gitee master && git merge FETCH_HEAD（参见 README「同步上游」）"
            echo "2. 本仓库已脱离 fork，GitHub 页面没有 Sync fork 按钮，不要再点"
          } > desp.md

          curl -s -X POST "https://sctapi.ftqq.com/${SC3_SENDKEY}.send" \
            --data-urlencode "title=森空岛脚本：上游有更新" \
            --data-urlencode "desp@desp.md"
